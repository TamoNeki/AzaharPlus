name: Libretro

on:
  workflow_dispatch:

env:
  CORE_NAME: azahar
  CORE_ARGS: -DENABLE_LIBRETRO=ON -DENABLE_QT=OFF -DENABLE_SDL2=OFF -DENABLE_ROOM=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_TESTS=OFF -DUSE_DISCORD_PRESENCE=OFF

jobs:
  libretro-windows:
    runs-on: ubuntu-latest
    env:
      OS: windows
      TARGET: x86_64
      BUILD_DIR: build/windows-x86_64
      EXTRA_CORE_ARGS: -DENABLE_LTO=OFF -DENABLE_SSE42=OFF -G Ninja
      CMAKE: x86_64-w64-mingw32.static-cmake
      IMAGE: reallibretroretroarch/libretro-build-mxe-win-cross-cores:mingw12
      EXTRA_PATH: bin/Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build core
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ env.IMAGE }}
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            mkdir -p ${{ env.BUILD_DIR }}
            cd ${{ env.BUILD_DIR }}
            ${{ env.CMAKE }} ../.. ${{ env.CORE_ARGS }} ${{ env.EXTRA_CORE_ARGS }}
            ninja

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ${{ env.BUILD_DIR }}/${{ env.EXTRA_PATH }}/${{ env.CORE_NAME }}_libretro.dll
